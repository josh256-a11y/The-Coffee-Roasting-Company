<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Coffee Roasting Company</title>
  <link rel="stylesheet" href="CSS/style.css">
  <script src="Javascript/JAVASCRIPT.js"></script>
  <script src="Javascript/form-validation.js"></script>
<script src="Javascript/lightbox.js"></script>



<meta name="description" content="Coffee Roasting Company – premium roasted beans, quality brews, and artisan equipment.">
<meta name="keywords" content="coffee, roasting, espresso, beans, café">

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Coffee Roasting Co.</a>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="enquiry.html">Enquiry</a></li>
          <li><a href="contact us.html">Contact us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-main">
    <h1>Contact & Locations</h1>
    <p>Visit our roastery or pop-up stall locations.</p>

    <section class="contact-info-grid">
      <div class="location-card">
        <h2>Roastery — Johannesburg</h2>
        <p>123 Roast St, Johannesburg</p>
 
        
<div class="map container">

<div class="map container">
 <iframe 
    src="https://www.google.com/maps?q=123+Coffee+Street,+Stellenbosch,+South+Africa&output=embed"
    width="150" 
    height="250" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
</iframe>

</div>

</div>

      </div>

      <div class="location-card">
        <h2>Market Stall — Rosebank</h2>
        <p>Market Lane, Rosebank</p>
       
        
<div class="map container">

<div class="map container">
<iframe 
    src="https://www.google.com/maps?q=123+Coffee+Street,+Stellenbosch,+South+Africa&output=embed"
    width="600" 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
</iframe>

</div>

</div>

      </div>
    </section>

    <section>
      <h2>Send us a message</h2>
      <form id="contactForm" class="form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Send</button>
        <div id="formStatus" role="status" aria-live="polite" class="status" hidden></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year3"></span> The Coffee Roasting Company</p>
    </div>
  </footer>

</body>
</html>
